# Runs the checks of tools/build.py (syntax, addon tests, tool tests, UTF-8, TOC, luacheck) on every
# push and pull request. It deploys nothing: GitHub Pages serves index.html from the root as before.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python packages (lupa with Lua 5.1, pytest)
        run: python -m pip install --upgrade pip "lupa>=2.0" pytest

      - name: luaparse for the syntax check
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          npm install --prefix "$RUNNER_TEMP/npm" --no-save --no-audit --no-fund luaparse@^0.3.1
          echo "NODE_PATH=$RUNNER_TEMP/npm/node_modules" >> "$GITHUB_ENV"

      - name: luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua-check

      - name: Check
        run: python tools/build.py check
