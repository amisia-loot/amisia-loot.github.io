# Publishes the site to GitHub Pages (Settings -> Pages -> Source: GitHub Actions). Only the site's
# folder Amisia-Website/ goes out (index.html, its images, data/ and the addon download Amisia.zip),
# without its supabase/ sources and notes.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'Amisia-Website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy are two jobs, and the deploy tries a second time after a pause: deploy-pages lists
# the run's artifacts right after the upload and, run in the same job, often finds none yet
# (actions/deploy-pages#451, failed here on 2026-11-25). A re-run of the failed run does not help, it
# only adds a second artifact of the same name.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude 'supabase/' --exclude '*.md' Amisia-Website/ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_again.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
