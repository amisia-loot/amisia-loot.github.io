# Publishes the site to GitHub Pages (Settings -> Pages -> Source: GitHub Actions). Only the site's
# files go out: index.html, its images, data/ and the addon download. Interim form: the site still
# lies at the repository root; after the move to Amisia-Website/ this stages that folder instead.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site/addon _site/data
          cp index.html favicon.png logo.png _site/
          cp -r data/. _site/data/
          cp addon/Amisia.zip _site/addon/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
