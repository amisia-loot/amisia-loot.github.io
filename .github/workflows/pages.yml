# Publishes the site to GitHub Pages (Settings -> Pages -> Source: GitHub Actions). Only the site's
# folder Amisia-Website/ goes out (index.html, its images, data/ and the addon download Amisia.zip),
# without its supabase/ sources and notes.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'Amisia-Website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude 'supabase/' --exclude '*.md' Amisia-Website/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
